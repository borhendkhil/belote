name: bellote_app
description: Belote contrée tunisienne — jeu mobile multijoueur.
publish_to: "none"
version: 0.2.0+21

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bellote_engine:
    path: ../../packages/bellote_engine
  intl: any
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/belote-logo .png
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
